name: pre-push HTML contract guard
on:
  push:
    branches: [main, portal/cloudflare-migration]
  pull_request:
    branches: [main, portal/cloudflare-migration]
permissions: read-all
jobs:
  guard-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML/JS contract guard
        run: bash .ci/guard.sh
