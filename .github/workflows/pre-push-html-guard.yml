name: pre-push HTML contract guard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: read-all
jobs:
  guard-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extended HTML/JS contract guard
        # runs the full matrix: six journal pages + all production surfaces
        # (auth bootstrap, dashboard family, admin, Logout, theme, funds portal,
        #  design assets, Legacy Pivot/GTF-Pro separation), the engine + test
        # suite (signal-scan guards, weekly-line digest, GTF-Pro), the data-quality
        # gates, and the deployment-critical files.
        run: |
          bash .ci/guard.sh --extended
