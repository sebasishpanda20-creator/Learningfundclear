name: Deploy research portal to Cloudflare

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deployment tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate production research contracts
        run: bash .ci/guard.sh
      - name: Build Cloudflare worker and static assets
        run: npm run build:cloudflare
      - name: Check email watch safety and retries
        run: node --test qa/crypto-email.test.mjs
      - name: Validate worker bundle
        run: npm run check:cloudflare
      - name: Check Cloudflare deployment credentials
        id: credentials
        shell: bash
        run: |
          # PR runs are a preflight and may pass without credentials, but a
          # push/workflow_dispatch that builds everything and then quietly
          # skips the deploy is exactly how a missing-token outage gets
          # mistaken for a live release. Fail loudly instead.
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy is preflight-only in PR: credentials missing, production deploy is limited to main pushes."
          else
            echo "::error::Cloudflare credentials missing on main push. Configure the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository Actions secrets, then re-run. The Workers deploy for this commit did NOT happen."
            exit 1
          fi
      - name: Deploy to existing learningfundclear Workers service
        if: github.event_name != 'pull_request' && steps.credentials.outputs.ready == 'true'
        run: npm run deploy:cloudflare
      - name: Summarize Cloudflare deployment status
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Cloudflare Worker preflight passed in PR; production deploy is limited to main pushes." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.credentials.outputs.ready }}" == "true" ]]; then
            echo "Cloudflare deploy command completed for Worker: learningfundclear" >> "$GITHUB_STEP_SUMMARY"
          fi
