name: Nifty 500 delayed and EOD data
on:
  schedule:
    # 09:30–15:45 IST, weekdays; source timestamps determine freshness.
    - cron: '0,15,30,45 4-10 * * 1-5'
    # 18:00 IST, separately from intraday collection.
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: Snapshot to collect
        type: choice
        options: [delayed, eod]
        default: eod
  push:
    branches: [main]
    paths: ['tools/nifty500-*', '.github/workflows/nifty500-data.yml']
permissions:
  contents: write
concurrency:
  group: nifty500-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Choose session and mode
        id: run
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os,datetime
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5,minutes=30)))
          mode=('eod delayed' if os.environ['EVENT']=='push' else os.environ.get('REQUESTED_MODE')) or ('eod' if os.environ.get('SCHEDULE')=='30 12 * * 1-5' else 'delayed')
          minute=now.hour*60+now.minute
          allowed=os.environ['EVENT']!='schedule' or (now.weekday()<5 and (mode=='eod' or 570<=minute<=945))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'mode={mode}\nenabled={str(allowed).lower()}\n')
          PY
      - name: Collect snapshot
        if: steps.run.outputs.enabled == 'true'
        run: |
          for mode in ${{ steps.run.outputs.mode }}; do
            if [ "$mode" = 'eod' ]; then
              python tools/nifty500-collect.py --mode eod --refresh-universe --output /tmp/nifty500-eod.json
            else
              python tools/nifty500-collect.py --mode delayed --output /tmp/nifty500-delayed.json
            fi
          done
      - name: Encrypt and retain last usable snapshot
        if: steps.run.outputs.enabled == 'true'
        env:
          MODE: ${{ steps.run.outputs.mode }}
        run: |
          for mode in $MODE; do
            node tools/nifty500-encrypt.cjs "/tmp/nifty500-$mode.json" "market-data/$mode-latest.enc.json"
          done
          python - <<'PY'
          import json,os,shutil
          for mode in os.environ['MODE'].split():
            d=json.load(open(f'/tmp/nifty500-{mode}.json'))
            if d['available']>0:shutil.copyfile(f'market-data/{mode}-latest.enc.json',f'market-data/{mode}-last-usable.enc.json')
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(f"## {mode}: {d['available']}/{d['total']} available\nSource: {d['source']}\nGenerated: {d['generatedAt']}\n\n{d['error'] or ''}\n")
          PY
      - name: Save encrypted snapshot
        if: steps.run.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data/*.enc.json market-data/nifty500-universe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update encrypted Nifty 500 snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
