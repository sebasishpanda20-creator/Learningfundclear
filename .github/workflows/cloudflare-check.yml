name: Cloudflare migration checks
on:
  pull_request:
    paths:
      - 'wrangler.jsonc'
      - 'scripts/build.mjs'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash .ci/guard.sh
      - run: npm run build:cloudflare
      - run: npm run check:cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
