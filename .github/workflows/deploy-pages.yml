# GitHub Pages deployment — LearningFundClear India
#
# Runs the data refresh nightly, checks the site, then publishes it.
# No secrets, no server, no build step: the published artifact is this repository folder.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Nothing else. See FREE-HOSTING.md.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 00:45 UTC = 06:15 IST, after AMFI has published the previous day's NAV file.
    - cron: '45 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh NAV data from AMFI
        continue-on-error: true
        run: python3 funds/tools/refresh-data.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- funds/assets/js/data.js; then
            echo "Data unchanged."
          else
            git config user.name  "Learningfundclear-bot"
            git config user.email "Learningfundclear-bot@users.noreply.github.com"
            git add funds/assets/js/data.js
            git commit -m "data: refresh NAV snapshot"
            git push
          fi

      - name: Verify the published data against AMFI's file
        run: python3 funds/tools/verify-data.py

      - name: Syntax-check every script
        run: |
          for f in $(find funds/assets/js -name '*.js') alerts.js vault.js dhan-quotes.js auth-guard.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Verify each page loads its stylesheet and the data file
        run: |
          missing=0
          for page in funds/index funds/funds funds/scheme funds/compare funds/calculators funds/methodology funds/legal; do
            for asset in 'assets/css/style.css' 'assets/js/data.js' 'assets/js/site.js'; do
              if ! grep -qF "$asset" "$page.html"; then
                echo "::error file=$page.html::$page.html does not reference $asset"
                missing=1
              fi
            done
          done
          # the merged journal must ship complete
          for f in index.html signin.html auth-guard.js alerts.js vault.js dhan-quotes.js dhan_security_ids.json india_symbols.json; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::journal file $f is missing from the deployment root"
              missing=1
            fi
          done
          exit $missing

      - name: Refuse to publish licensed exchange data
        # upload-pages-artifact ships this whole folder (path: .), so anything
        # sitting in the workspace at that point goes live, whether or not git
        # tracks it. NSE/BSE bhavcopy CSVs are licensed for personal use only —
        # displaying them here would be redistribution, and that is the one line
        # that would turn this site into something that needs exchange approval.
        # They belong in the private bhavcopy-data repo. This step exists so a
        # stray commit, or someone running the fetcher in CI, fails the deploy
        # loudly instead of quietly publishing a price archive.
        run: |
          leaks=$( { find . -name .git -prune -o -type f \
                      \( -iname '*.csv' -o -iname '*.zip' -o -iname '*.xls' -o -iname '*.xlsx' \) -print
                    find data bhavcopy-data -name .git -prune -o -type f -print 2>/dev/null || true
                  } | sed 's|^\./||' | sort -u )
          if [ -n "$leaks" ]; then
            echo "$leaks" | while IFS= read -r f; do
              echo "::error file=$f::$f is licensed exchange data and must not be published"
            done
            echo "::error::Move it out of this repo (see README, Personal analysis tools) and re-run the deploy."
            exit 1
          fi
          echo "No exchange-data files in the folder about to be published."

      - uses: actions/configure-pages@v5
        id: pages

      - name: Point the sitemap and robots.txt at the real Pages URL
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          if [ -z "$base" ]; then
            base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          echo "Sitemap base: $base/"
          sed -i "s#https://YOUR-SITE.example/#$base/#g" robots.txt funds/sitemap.xml
          sed -i "s#Sitemap: /sitemap.xml#Sitemap: $base/funds/sitemap.xml#" funds/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
