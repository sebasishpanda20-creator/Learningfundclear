name: Deploy to GitHub Pages

# Publishes the portal at https://sebasishpanda20-creator.github.io/Learningfundclear/
# No build step: the repository root is the static site.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' ./ dist/
          touch dist/.nojekyll
          test -f dist/index.html
          # Fail the deploy if the single-file portal is truncated or missing its
          # core features, instead of shipping a broken page.
          grep -q 'id="panic-bar"' dist/index.html
          grep -q 'Quarter-Kelly' dist/index.html
          grep -q '</script>' dist/index.html
          grep -q '</html>' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
