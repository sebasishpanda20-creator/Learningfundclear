<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Sign in · LearningFundClear</title>
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="stylesheet" href="assets/css/signin.css" />
    <script src="assets/vendor/supabase.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="auth-guard.js"></script>
      <link rel="stylesheet" href="assets/css/mobile-first.css" />
      <script src="assets/js/mobile-first.js"></script>
  </head>
  <body class="signin-page">
    <main class="signin-shell" id="main">
      <a class="signin-brand" href="signin.html">
        <span class="signin-badge" aria-hidden="true">LF</span>
        <span class="signin-brand-text">
          <strong>LearningFundClear</strong>
          <small>Research &amp; trade decision support · ₹ · IST</small>
        </span>
      </a>

      <section class="signin-card">
        <header class="signin-card-head">
          <h1>Sign in</h1>
          <p>Approved users only. Sessions expire after 14 days.</p>
        </header>
        <form id="loginForm" class="signin-card-body">
          <label for="loginUser">Username</label>
          <input
            id="loginUser"
            required
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
          />
          <label for="loginPass">Password</label>
          <input
            id="loginPass"
            type="password"
            required
            autocomplete="current-password"
          />
          <button class="signin-submit" type="submit" id="loginBtn">
            Sign in
          </button>
          <p class="msg" id="msg" role="status" aria-live="polite"></p>
          <p class="signin-help" id="help" role="status" aria-live="polite" hidden></p>
          <div class="signin-card-foot">
            <button type="button" class="signin-link" id="requestAccess">
              Request access
            </button>
            <button type="button" class="signin-link" id="forgotPassword">
              Forgot password?
            </button>
          </div>
        </form>
      </section>

      <p class="signin-disclaimer">
        Private portal. Market data shown is delayed / snapshot-based and never
        live. No broker connectivity.
      </p>
    </main>
    <script src="assets/js/signin.js"></script>
  </body>
</html>
